<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>학급 달력</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f7fa;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        text-align: center;
      }
      h2 {
        text-align: center;
      }
      p {
        text-align: center;
        font-size: 14px;
      }
      #weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
      }
      #monthNavigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }
      #monthNavigation h2 {
        position: absolute;
        left: 50%;
        transform: translate(-50%);
        margin: 0;
      }
      #calendarDays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        gap: 8px;
      }
      #calendarDays span {
        padding: 12px 0;
      }
      #weekdays span {
        border: 1px solid;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>학급 달력</h1>
    <hr>
    <p>시험, 수행평가, 행사 일정 확인</p>
    <div id="monthNavigation">
      <button>←</button>
      <h2>2026년 10월</h2>
      <button>→</button>
    </div>
      <div id="weekdays">
        <span>일</span>
        <span>월</span>
        <span>화</span>
        <span>수</span>
        <span>목</span>
        <span>금</span>
        <span>토</span>
      </div>
      <div id="calenderDays"></div>
  </body>
  <script>
    const calendarDays = getElementById("calendarDays");

    const year = 2026;
    const month = 9;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    
    for (let i = 0; i < firstDay; i++) { 
      calendarDays.innerHTML += "<span></span>"; 
    } 
    for (let day = 1; day <= lastDate; day++) { 
      calendarDays.innerHTML += `<span>${day}</span>`; 
    } 
  </script>
</html>
