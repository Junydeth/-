<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>학급 달력</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f7fa;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        text-align: center;
      }
      h2 {
        text-align: center;
      }
      p {
        text-align: center;
        font-size: 14px;
      }
      #weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>학급 달력</h1>
    <hr>
    <p>시험, 수행평가, 행사 일정 확인</p>
    <div>
      <button><-</button>
      <h2>2026년 10월</h2>
      <div id="weekdays">
        <span>일</span>
        <span>월</span>
        <span>화</span>
        <span>수</span>
        <span>목</span>
        <span>금</span>
        <span>토</span>
      </div>
      <div id="calenderDays"></div>
      <button>-></button>
    </div>
  </body>
</html>
