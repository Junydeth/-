<!DOCTYPE html>
<html>
<head>
<title>우리들의 글</title>
</head>
<body>
<div style="position: relative;
display: flex;
align-item:center;
justify-content:center;">
<span id="editStatus" style="display: none; position: absolute; left: 10px;">
수정 중...
</span>
<h1 style="text-align: center;">글 보는 곳</h1>
<button id="editButton" style="position: absolute; right: 10px;
top: 100px"
onclick="editMode()">수정</button>
</div>

<p style="text-align: center;">글 보는 곳</p>
<hr>
<h2 style="text-align: center;">글 목록
</h2>
<ul id="postList" style="padding-left: 0;">
<li style="list-style-type: none;
border: 1px solid black;
padding: 8px;
border-radius: 8px;
width: 500px;
margin: 0 auto 10px;">
<details>
<summary>??? - 학교 생활</summary>
     <p>시험보기싫다 공부하기싫다 집에 가고 싶다아아~~~~
     </p></details></li>
    <li style="list-style-type: none;
border: 1px solid black;
padding: 8px;
border-radius: 8px;
width: 500px;
margin: 0 auto 10px;">
<details>
<summary>??? - 야자 생활</summary> <p>야자 째고 PC방이 가고 싶당 헤헤 </p> </details></li>
</ul>
<div id="addButton" 
style="text-align: center;
display: none;">
    <button onclick="WriteForm()">+</button>
</div>
<div id="writeForm"  			
style="display: none;
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 600px;
border: 2px solid black;
padding: 25px;
border-radius: 12px;
background-color: white;">
	<button onclick="CloseForm()"
	style="position: absolute;
	top: 4px;
	right: 4px;
	border-radius: 4px;">X</button>
	<h2 style="text-align: center">글 쓰기</h2>
<div style="display: flex; gap: 15px;">
	<div style="flex: 1;">
		<p>이름</p>
		<input type="text" id="writer" 
		placeholder="작성자 입력"
		style="width: 100%; box-sizing: border-box;;">
	</div>
	<div style="flex: 2;">
		<p>제목</p>
		<input type="text" id="title" 
		placeholder="제목 입력"
		style="width: 100%; box-sizing: border-box;">
	</div>
</div>
	<p>내용</p>
	<textarea id="content"
	placeholder="내용 입력"
	style="width: 100%;
	height: 300px;
	box-sizing: border-box;"></textarea>
	<div style="text-align: center; margin-top: 15px;">
		<button onclick="addPost()">작성완료</button>
	</div>
</div>						
<script>
let isEditing = false;
let editingPost = null;

function editMode() {		//여기부터 편집기능
if (isEditing === false) {
    isEditing = true;
	document.querySelectorAll(".postButtons")
	.forEach(b => b.style.display = "block");
	document.getElementById
        	("addButton")
        	.style.display ="block";
       	document.getElementById
        	("editButton")
       	.textContent = "수정 취소";
        	document.getElementById
        	("editStatus")
        	.style.display = "block";
        	document.querySelectorAll
        	("#postList details")
       	.forEach(function(post)
        	{post.open = false;
        	});}
       	else {	
	isEditing = false;
	document.querySelectorAll(".postButtons")
	.forEach(b => b.style.display = "none");
       	document.getElementById
        	("addButton")
        	.style.display ="none";
        	document.getElementById
        	("editButton")
       	.textContent = "수정";
        	document.getElementById	
	("editStatus")
        	.style.display = "none";}
}
	document.querySelectorAll
	("#postList summary")
        	.forEach(function(title) {
        	title.addEventListener
        	("click", function(event) {
        	if (isEditing) {
        	event.preventDefault();}
            });
            });			//여기까지 편집기능
function WriteForm() {
	document.getElementById
	("writeForm")
	.style.display = "block";
	document.getElementById
	("editButton")
	.disabled = true;
	document.querySelector
	("#addButton button")
	.disabled = true;
}
function CloseForm() {
	document.getElementById("writeForm").style.display = "none";
	editingPost = null;
	document.getElementById("writer").value = "";
    	document.getElementById("title").value = "";
    	document.getElementById("content").value = "";
    	document.getElementById("editButton").disabled = false;
    	document.querySelector("#addButton button").disabled = false;
}
function addPost() {
	let writer = document.getElementById
	("writer").value;
	let title = document.getElementById
	("title").value;
	let content = document.getElementById
	("content").value;
	if (!writer.trim() || !title.trim() || !content.trim()) {
    		alert("이름, 제목, 내용을 모두 입력하세요.");
    		return;
}
	if (editingPost !== null) {
		editingPost.querySelector("summary").textContent = writer + " - " + title;
		editingPost.querySelector("p").textContent = content;
		editingPost = null;
		document.getElementById("writer").value = "";
		document.getElementById("title").value = "";
		document.getElementById("content").value = "";
		CloseForm();
		return;
	}
	let li = document.createElement("li");
	li.style.cssText = "list-style-type:none; border:1px solid black; padding:8px; border-radius:8px; width:500px; margin:10px auto;";
	document.getElementById("writer").value = "";
	document.getElementById("title").value = "";
	document.getElementById("content").value = "";
	CloseForm();
	li.innerHTML = `
	<div style="display:flex; justify-content:space-between; align-items:center;">
    	<details>
        	<summary>${writer} - ${title}</summary>
        	<p>${content}</p>
    	</details>
    	<div class="postButtons" style="display:${isEditing ? 'block' : 'none'};">
        	<button onclick="editPost(this)">수정</button>
        	<button onclick="deletePost(this)">삭제</button>
    	</div>
	</div>`;	
	document.getElementById("postList").appendChild(li);
}
function deletePost(button) {
	button.closest("li").remove();
}
function editPost(button) {
	let li = button.closest("li");
	editingPost = li;
	let details = li.querySelector("details");
	let writerTitle = details.querySelector("summary").textContent;
	let content = details.querySelector("p").textContent;
	document.getElementById("writer").value = writerTitle.split(" - ")[0];
	document.getElementById("title").value = writerTitle.split(" - ")[1];
	document.getElementById("content").value = content;
	WriteForm();
	}
	
</script>
</body>
</html>
